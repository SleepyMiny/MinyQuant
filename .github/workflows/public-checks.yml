name: Public repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docs-and-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public commit history
        run: python3 scripts/check_public_history.py
      - name: Check documentation
        run: python3 scripts/check_docs.py
